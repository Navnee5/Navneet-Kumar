databases:
  - name: trainee-attendance-db
    databaseName: trainee_attendance
    user: trainee_attendance_user
    plan: free

services:
  - type: web
    name: trainee-attendance-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trainee-attendance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: RENDER
        value: "true"
